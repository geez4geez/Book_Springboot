<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Buku</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="nav">
    <div class="isi">
        <span class="merek">Perpustakaan</span>
        <a th:href="@{/buku}" class="aktif">Buku</a>
        <a th:href="@{/anggota}">Anggota</a>
        <a th:href="@{/pinjam}">Pinjam Buku</a>
    </div>
</nav>

<main>
    <h1>Daftar Buku</h1>

    <div class="kartu">
        <form class="baris" th:action="@{/buku}" method="get">
            <input name="kata" th:value="${kata}" placeholder="Cari judul buku" aria-label="Cari judul buku">
            <button type="submit">Cari</button>
        </form>
    </div>

    <div class="kartu">
        <p class="kosong" th:if="${#lists.isEmpty(daftarBuku)}">Tidak ada buku yang cocok.</p>
        <div class="tabel-bungkus" th:unless="${#lists.isEmpty(daftarBuku)}">
            <table>
                <tr><th>ID</th><th>Judul</th><th>Stok</th></tr>
                <tr th:each="b : ${daftarBuku}">
                    <td th:text="${b.idBuku}">B001</td>
                    <td th:text="${b.judul}">Judul buku</td>
                    <td>
                        <span class="lencana" th:classappend="${b.stok > 0} ? 'ok' : 'habis'"
                              th:text="${b.stok}">0</span>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="kartu">
        <h2>Tambah Buku</h2>
        <form class="baris" th:action="@{/buku}" method="post">
            <input name="idBuku" placeholder="ID (contoh: B004)" aria-label="ID buku" required>
            <input name="judul" placeholder="Judul buku" aria-label="Judul buku" required>
            <input name="stok" type="number" min="0" value="1" aria-label="Stok">
            <button type="submit">Simpan Buku</button>
        </form>
    </div>
</main>
</body>
</html>
